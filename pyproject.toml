[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-substrate-mesh"
version = "2.0.0"
description = "High-density cloud-native runtime and declarative AX orchestrator for stateful autonomous AI agents."
readme = "README.md"
authors = [{ name = "Aamir Zameer [Az.]", email = "aamirmalikzameer@gmail.com" }]
license = { text = "Apache-2.0" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
requires-python = ">=3.9"

[project.scripts]
substrate = "substrate.cli:main"
